x-notifications-api-observability:
  environment: &notifications-api-observability-env-overrides
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    PROMETHEUS_EXPORTER_ADDR: :9001
    EXPORT_OTEL_TRACES: true
    EXPORT_OTEL_METRICS: true

services:
  notifications-api:
    ports:
      - 9001:9001
    environment:
      <<: *notifications-api-observability-env-overrides
      OTEL_SERVICE_NAME: notifications-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=notifications,service.instance.id=notifications-api,deployment.environment=dev

  smtp-debug:
    ports:
      - 9002:9001
    environment:
      <<: *notifications-api-observability-env-overrides
      OTEL_SERVICE_NAME: smtp-debug
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=notifications,service.instance.id=smtp-debug,deployment.environment=dev

  smtp-proxy:
    ports:
      - 9003:9001
    environment:
      <<: *notifications-api-observability-env-overrides
      OTEL_SERVICE_NAME: smtp-proxy
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=notifications,service.instance.id=smtp-proxy,deployment.environment=dev

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./configs/local-observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=native-histograms"
    ports:
      - 9090:9090
    user: ":"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./configs/local-observability/grafana:/etc/grafana/provisioning
      - ./configs/dashboards:/etc/grafana/dashboardFiles
    user: ":"

  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
      - "12347:12347"
      - "4317:4317"
    volumes:
      - ./configs/local-observability/config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
      - "9600:9600"
    command: -config.file=/etc/loki/local-config.yml --log.level=info
    volumes:
      - ./configs/local-observability/loki.yml:/etc/loki/local-config.yml

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./configs/local-observability/tempo.yml:/etc/tempo/tempo.yml

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040:4040"
