variables:
  KUBERNETES_CPU_LIMIT: "8"
  KUBERNETES_CPU_REQUEST: "3"

stages:
  - test

go-tests:
  tags: [kata]
  stage: test
  image: golang:1.27-alpine
  before_script:
    - go mod download
    - apk add make npm
    - go generate ./...
  script:
    - go test -coverpkg=./... -coverprofile=coverage.out ./...
  after_script:
    - go tool cover -html=coverage.out -o coverage.html
    - go get github.com/boumenot/gocover-cobertura
    - go run github.com/boumenot/gocover-cobertura < coverage.out > coverage.xml
    - PERCENTAGE=$(go tool cover -func=coverage.out |  tail -1 | awk -F" " '{print $NF}')
    - 'echo Percent covered: "$PERCENTAGE" throughout all packages!'
  coverage: '/^Percent covered: (\d+.\d+\%) throughout all packages!/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - ./coverage.xml
      - ./coverage.out
      - ./coverage.html
